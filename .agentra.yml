project:
  name: Agentra
  languages:
  - python
  frameworks: []
  sdks: []
  databases: []
security:
  mode: standard
  edr_safe: true
  compliance: []
optimization:
  minimal_context: true
  token_budget:
    input: 6000
    output: 2000
agents:
- copilot
skills:
- python
- kubernetes
- docker
- github_actions
- knowledge-graph
- rag-search
- code-patterns
karpathy_guidelines: false
scanner_enabled: true
index:
  path: .agentra
  enabled: true
  exclude:
  - node_modules
  - .venv
  - venv
  - dist
  - build
  - __pycache__
rag:
  enabled: true
  top_k: 5
  antipatterns: true
  include_in_agent_files: false
model_preferences:
  copilot: gpt-5.4
model_purpose_preferences:
  copilot:
    planning: gpt-5.5
    reasoning: gpt-5.5
    review: gpt-5.5
    coding: gpt-5.3-codex
    testing: gpt-5.3-codex
    refactoring: gpt-5.3-codex
    documentation: gpt-5.4
    general: gpt-5.4
    formatting: gpt-5.4
